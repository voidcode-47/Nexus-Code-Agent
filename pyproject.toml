[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "nexus-code-agent"
version = "0.1.0"
description = "Nexus-Code-Agent: Autonomous Code Healing & Evolution Platform"
authors = ["Nexus Team <team@nexus-code-agent.dev>"]
readme = "README.md"
packages = [{ include = "src" }]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Core / web
fastapi = ">=0.110"
uvicorn = { version = ">=0.27", extras = ["standard"] }
httpx = ">=0.27"
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
python-dotenv = ">=1.0"
pyyaml = ">=6.0"
typer = ">=0.12"
rich = ">=13.7"
sse-starlette = ">=2.0"

# Graph / retrieval
networkx = ">=3.2"
numpy = ">=1.26"
rank-bm25 = ">=0.2"
qdrant-client = ">=1.8"

# Agent orchestration
langgraph = ">=0.1"
langgraph-checkpoint-postgres = ">=1.0"
psycopg = { version = ">=3.1", extras = ["binary", "pool"] }

# Sandbox / infra
docker = ">=7.0"
psutil = ">=5.9"
redis = ">=5.0"

# MCP tool matrix
mcp = ">=1.2"
fastmcp = ">=2.0"

# Code parsing
tree-sitter = ">=0.22"
tree-sitter-python = ">=0.21"
tree-sitter-javascript = { version = ">=0.21", optional = true }
tree-sitter-typescript = { version = ">=0.21", optional = true }
tree-sitter-go = { version = ">=0.21", optional = true }

# Evaluation (optional): HuggingFace SWE-bench Lite dataset
datasets = { version = ">=2.18", optional = true }

# Patch matching
rapidfuzz = ">=3.6"

[tool.poetry.extras]
multilang = ["tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-go"]
eval = ["datasets"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
mypy = ">=1.10"
ruff = ">=0.4"
pyright = ">=1.1.360"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/cli.py" = ["B008"]  # typer.Option 作为默认值是 Typer 的标准用法
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
